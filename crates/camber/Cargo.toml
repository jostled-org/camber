[package]
name = "camber"
version = "0.4.2"
edition.workspace = true
autotests = false
description = "Opinionated async Rust for IO-bound services on top of Tokio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/camber"
homepage = "https://github.com/jostled-org/camber"
documentation = "https://docs.rs/camber"
readme = "../../README.md"
keywords = ["tokio", "async", "http", "runtime", "middleware"]
categories = ["asynchronous", "network-programming", "web-programming::http-server", "web-programming::http-client"]

[package.metadata.docs.rs]
features = ["profiling", "ws", "grpc", "acme", "dns01", "nats", "sqs", "otel"]

[lints]
workspace = true

[features]
profiling = ["dep:pprof"]
ws = ["dep:tokio-tungstenite"]
grpc = ["dep:tonic", "dep:tonic-reflection", "dep:tonic-health"]
acme = ["dep:rustls-acme"]
dns01 = ["dep:instant-acme"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc-crate"]
nats = ["dep:async-nats"]
sqs = ["dep:aws-sdk-sqs", "dep:aws-config"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
bytes = "1.11.1"
chrono = { version = "0.4.20", default-features = false, features = ["now"] }
cron = "0.17"
crossbeam-channel = "0.5"
http-body-util = "0.1"
itoa = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "tokio"] }
metrics = "0.24.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23.18", features = ["aws-lc-rs"] }
tokio = { version = "1.23.1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
tokio-rustls = "0.26"
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = "0.3"
pprof = { version = "0.15", features = ["flamegraph"], optional = true }
thiserror = "2"
tonic = { version = "0.14", default-features = false, features = ["codegen"], optional = true }
tonic-health = { version = "0.14", default-features = false, optional = true }
tonic-reflection = { version = "0.14", default-features = false, features = ["server"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "query"] }
tikv-jemallocator = { version = "0.7", optional = true }
mimalloc-crate = { package = "mimalloc", version = "0.1", optional = true }
async-nats = { version = "0.50", default-features = false, optional = true }
aws-sdk-sqs = { version = "1.93", default-features = false, features = ["rustls", "rt-tokio"], optional = true }
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio"], optional = true }
flate2 = "1"
arc-swap = "1"
arrayvec = "0.7"
metrics-exporter-prometheus = { version = "0.18.1", default-features = false }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
rustls-acme = { version = "0.15", optional = true, default-features = false, features = ["aws-lc-rs", "webpki-roots"] }
instant-acme = { version = "0.8", optional = true, features = ["rcgen"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", optional = true, features = ["grpc-tonic"] }
tracing-opentelemetry = { version = "0.33", optional = true }
camber-macros = { version = "0.3.0", path = "../camber-macros" }

[dev-dependencies]
allocation-counter = "=0.8.1"
flate2 = "1"
h2 = "0.4.4"
http = "1"
hyper = { version = "1", features = ["client"] }
metrics = "0.24.3"
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tempfile = "3"
tokio = { version = "1.23.1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "test-util"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel"] }
tonic-health = { version = "0.14" }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", features = ["server"] }
tungstenite = "0.30"
tracing-subscriber = { version = "0.3.20", features = ["registry"] }
rustls-acme = { version = "0.15", default-features = false, features = ["aws-lc-rs", "webpki-roots"] }
wiremock = "0.6"

[build-dependencies]
camber-build = { version = "0.3.0", path = "../camber-build" }

[[test]]
name = "acceptance_e2e"
path = "tests/acceptance_e2e.rs"

[[test]]
name = "acceptance_owned_lifecycle"
path = "tests/acceptance_owned_lifecycle.rs"

[[test]]
name = "acceptance_proxy"
path = "tests/acceptance_proxy.rs"

[[test]]
name = "component_body_files"
path = "tests/component_body_files.rs"

[[test]]
name = "component_http_routing"
path = "tests/component_http_routing.rs"

[[test]]
name = "component_integrations"
path = "tests/component_integrations.rs"

[[test]]
name = "component_middleware"
path = "tests/component_middleware.rs"

[[test]]
name = "component_observability"
path = "tests/component_observability.rs"

[[test]]
name = "component_protocols"
path = "tests/component_protocols.rs"

[[test]]
name = "component_runtime_concurrency"
path = "tests/component_runtime_concurrency.rs"

[[test]]
name = "component_runtime_resources"
path = "tests/component_runtime_resources.rs"

[[test]]
name = "component_streaming"
path = "tests/component_streaming.rs"

[[test]]
name = "component_transports"
path = "tests/component_transports.rs"

[[test]]
name = "component_websocket"
path = "tests/component_websocket.rs"

[[test]]
name = "external_feature_services"
path = "tests/external_feature_services.rs"

[[test]]
name = "focused_api_contracts"
path = "tests/focused_api_contracts.rs"

[[test]]
name = "process_observability_globals"
path = "tests/process_observability_globals.rs"
