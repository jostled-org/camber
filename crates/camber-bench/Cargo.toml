[package]
name = "camber-bench"
version = "0.2.2"
edition.workspace = true
autotests = false
publish = false
license = "MIT OR Apache-2.0"
readme = "../../README.md"

[lints]
workspace = true

[lib]
name = "camber_bench"
path = "src/lib.rs"

[[bin]]
name = "camber-bench"
path = "src/main.rs"

[[bin]]
name = "bench-upstream"
path = "src/bin/bench_upstream.rs"

[[bin]]
name = "bench-camber"
path = "src/bin/bench_camber.rs"

[[bin]]
name = "bench-axum"
path = "src/bin/bench_axum.rs"

[dependencies]
axum = "0.8"
camber = { version = "0.4.0", path = "../camber" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tower-http = { version = "0.7", features = ["cors", "compression-gzip"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
bytes = "1"

[[test]]
name = "external_bench_tools"
path = "tests/external_bench_tools.rs"

[[test]]
name = "focused_bench"
path = "tests/focused_bench.rs"

[[test]]
name = "process_bench_smoke"
path = "tests/process_bench_smoke.rs"
