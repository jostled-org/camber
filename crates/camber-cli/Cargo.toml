[package]
name = "camber-cli"
version = "0.7.0"
edition.workspace = true
autotests = false
description = "CLI, project scaffolding, and config-driven proxy for Camber"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/camber"
homepage = "https://github.com/jostled-org/camber"
documentation = "https://docs.rs/camber-cli"
readme = "../../README.md"
keywords = ["camber", "cli", "proxy", "tokio", "http"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]

[lints]
workspace = true

[[bin]]
name = "camber"
path = "src/main.rs"

[lib]
name = "camber_cli"
path = "src/lib.rs"

[dependencies]
camber = { version = "0.7.0", path = "../camber", features = ["acme", "dns01"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "external_cli_operational"
path = "tests/external_cli_operational.rs"

[[test]]
name = "process_cli_serve"
path = "tests/process_cli_serve.rs"

[[test]]
name = "process_cli_tooling"
path = "tests/process_cli_tooling.rs"
