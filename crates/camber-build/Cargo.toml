[package]
name = "camber-build"
version = "0.2.3"
edition.workspace = true
autotests = false
description = "Build helpers for Camber code generation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jostled-org/camber"
homepage = "https://github.com/jostled-org/camber"
documentation = "https://docs.rs/camber-build"
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[[test]]
name = "component_codegen"
path = "tests/component_codegen.rs"
