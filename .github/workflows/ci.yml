name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CAMBER_CI_FEATURES: profiling,ws,grpc,acme,dns01,nats,sqs,otel

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.manifest.toml'
              - '.pedant.toml'
              - '.pedant/**'
              - 'deny.toml'
              - '.github/**'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc and ripgrep
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ripgrep

      - uses: Swatinem/rust-cache@v2

      - run: .github/scripts/plan-loop-hooks-selftest.sh
      - run: cargo fmt --check
      - run: cargo clippy --workspace --features "${CAMBER_CI_FEATURES}" -- -D warnings
      # camber-bench measurements have no place on a shared runner, so its tests
      # stay out of this lane. Static source and test policy still covers it in
      # the Pedant matrices below.
      #
      # `timeout` enforces the deadline from a plain OS process. A step-level
      # timeout-minutes is enforced by the runner agent itself, so a test that
      # starves the runner takes the enforcement down with it — that is how
      # earlier runs reached 47 minutes on a 15-minute limit. The outer
      # timeout-minutes stays as a backstop for the cold-cache compile.
      - name: Run workspace tests
        run: >-
          timeout --signal=KILL 900
          cargo test --workspace --exclude camber-bench
          --features "${CAMBER_CI_FEATURES}"
        timeout-minutes: 20

  dependency-policy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny
      - run: cargo deny --workspace check

  pedant-source:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [camber, camber-bench, camber-build, camber-cli, camber-macros]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install pedant
      - name: Check package source tree
        run: .github/scripts/check-pedant.sh source "${{ matrix.package }}"

  pedant-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [camber, camber-bench, camber-build, camber-cli, camber-macros]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install pedant
      - name: Check package test tree
        run: .github/scripts/check-pedant.sh tests "${{ matrix.package }}"

  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install pedant
      - run: .github/scripts/check-supply-chain.sh
