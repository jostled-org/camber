name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CAMBER_CI_FEATURES: profiling,ws,grpc,acme,dns01,nats,sqs,otel

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.manifest.toml'
              - '.pedant.toml'
              - '.pedant/**'
              - 'deny.toml'
              - '.github/workflows/**'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --workspace --features "${CAMBER_CI_FEATURES}" -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --features "${CAMBER_CI_FEATURES}"
        timeout-minutes: 15

  dependency-policy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny
      - run: cargo deny --workspace check

  pedant-source:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [camber, camber-bench, camber-build, camber-cli, camber-macros]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install pedant
      - name: Check package source tree
        run: pedant check --format github $(git ls-files "crates/${{ matrix.package }}/src")

  pedant-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [camber, camber-bench, camber-build, camber-cli, camber-macros]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install pedant
      - name: Check package test tree
        run: pedant check --format github $(git ls-files "crates/${{ matrix.package }}/tests")

  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jostled-org/pedant/.github/actions/supply-chain-check@04cc045ab6d61f9cab4fb182f296f9b12e17930f
        with:
          baseline-path: .pedant/baselines
          fail-on: hash-mismatch
