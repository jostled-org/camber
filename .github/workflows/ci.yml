name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CAMBER_CI_FEATURES: profiling,ws,grpc,acme,dns01,nats,sqs,otel

# Actions are pinned to immutable commits. Resolved on 2026-09-22 from the
# previously selected tags: actions/checkout v4, dorny/paths-filter v3,
# Swatinem/rust-cache v2. rustup installs the toolchain rust-toolchain.toml
# pins, `reproduce-ci.sh install-tools` installs the Cargo-built tools at the
# versions .github/workflow-tools.toml pins, and every tool-using job admits
# its tools through `reproduce-ci.sh require-tools` against those records.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - 'crates/**'
              - '**/*.md'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/.pedant.toml'
              - '.pedant/**'
              - 'deny.toml'
              - '.github/**'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: .github/scripts/reproduce-ci.sh require-tools git rg rustc cargo clippy rustfmt
      - run: .github/scripts/ci-selftest.sh
      - run: cargo fmt --check
      - run: cargo clippy --workspace --features "${CAMBER_CI_FEATURES}" -- -D warnings
      - name: Check API documentation
        run: >-
          cargo --config 'build.rustdocflags=["-D","warnings"]' doc
          --workspace --lib --features "${CAMBER_CI_FEATURES}" --no-deps
      # Bench correctness tests run here; external measurements remain ignored.
      #
      # `timeout` enforces the deadline from a plain OS process. A step-level
      # timeout-minutes is enforced by the runner agent itself, so a test that
      # starves the runner takes the enforcement down with it — that is how
      # earlier runs reached 47 minutes on a 15-minute limit. The outer
      # timeout-minutes stays as a backstop for the cold-cache compile.
      - name: Run workspace tests
        run: >-
          timeout --signal=KILL 900
          cargo test --workspace
          --features "${CAMBER_CI_FEATURES}"
        timeout-minutes: 20

  dependency-policy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: .github/scripts/reproduce-ci.sh install-tools cargo-deny
      - run: .github/scripts/reproduce-ci.sh require-tools rustc cargo cargo-deny
      - run: cargo deny --workspace check

  pedant-source:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [camber, camber-bench, camber-build, camber-cli, camber-macros]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: .github/scripts/reproduce-ci.sh install-tools pedant
      - run: .github/scripts/reproduce-ci.sh require-tools rustc cargo pedant
      - name: Check package source tree
        run: .github/scripts/check-pedant.sh source "${{ matrix.package }}"

  pedant-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [camber, camber-bench, camber-build, camber-cli, camber-macros]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: .github/scripts/reproduce-ci.sh install-tools pedant
      - run: .github/scripts/reproduce-ci.sh require-tools rustc cargo pedant
      - name: Check package test tree
        run: .github/scripts/check-pedant.sh tests "${{ matrix.package }}"

  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: .github/scripts/reproduce-ci.sh install-tools pedant
      - run: .github/scripts/reproduce-ci.sh require-tools rustc cargo pedant
      - run: .github/scripts/check-supply-chain.sh
