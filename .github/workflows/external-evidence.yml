name: External Evidence

on:
  workflow_dispatch:
    inputs:
      lane:
        description: External evidence lane
        required: true
        type: choice
        options:
          - nats
          - sqs
          - dns
          - dns_public
          - docker
          - go
          - load_generators
  pull_request:
    paths: &compatibility_paths
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/external-evidence.yml'
      - '.github/workflow-tools.toml'
      - '.github/scripts/check-local-integrations.sh'
      - '.github/scripts/reproduce-ci.sh'
  push:
    branches: [main]
    paths: *compatibility_paths

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CAMBER_EXTERNAL_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

# The local service lanes (nats, sqs, dns) run through the shared
# `.github/scripts/check-local-integrations.sh` runner. It starts digest-pinned
# images from `.github/workflow-tools.toml` and writes every local lane's
# evidence. The other lanes run here directly. Every selected test runs as an
# exact single-test cargo invocation with a distinct
# CAMBER_EXTERNAL_CLEANUP_WITNESS path; a missing witness after a passing test
# fails the lane (cleanup evidence is part of the contract). Unselected lanes
# record a not_selected marker — never a pass — through the same runner's
# `--not-selected` mode, so one writer owns every marker. The public DNS lane
# (dns_public) is manual and is not local evidence.

jobs:
  not-selected:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [dns, dns_public, docker, go, load_generators, nats, sqs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.lane != inputs.lane
      - name: Record unselected lane
        if: matrix.lane != inputs.lane
        run: .github/scripts/check-local-integrations.sh --not-selected "${{ matrix.lane }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.lane != inputs.lane
        with:
          name: external-${{ matrix.lane }}-not-selected
          path: logs/external/${{ matrix.lane }}.json

  # The local lanes share one step list. Each job id is its lane, so
  # `github.job` selects the runner lane and names the lane's evidence.
  nats:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'nats'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: &local_lane_steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run ${{ github.job }} lane
        run: .github/scripts/check-local-integrations.sh ${{ github.job }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-${{ github.job }}-evidence
          # Only this lane's files: the runner also marks the lanes it did
          # not run as not_selected, and those lanes run in their own jobs.
          path: |
            logs/external/${{ github.job }}.json
            logs/external/${{ github.job }}.log
            logs/external/${{ github.job }}-*

  sqs:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'sqs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: *local_lane_steps

  dns:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'dns'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: *local_lane_steps

  dns-public:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'dns_public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACME_TEST_DOMAIN: ${{ secrets.ACME_TEST_DOMAIN }}
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
    steps:
      - name: Validate DNS prerequisites
        shell: bash
        run: |
          test -n "$ACME_TEST_DOMAIN" || { echo '::error::Set ACME_TEST_DOMAIN before selecting the public DNS lane'; exit 1; }
          test -n "$CF_TOKEN" || { echo '::error::Set CF_TOKEN before selecting the public DNS lane'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run public dns lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          t=acme_dns01_provisions_cert
          CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/dns_public-$t.json" \
            cargo test -p camber --features dns01 --test external_feature_services -- \
            "external_dns01::$t" --exact --ignored --test-threads=1 2>&1 | tee logs/external/dns_public.log
          [ -f "logs/external/dns_public-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-dns-public-evidence
          path: logs/external

  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'docker'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run docker lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          t=dockerfile_builds_successfully
          CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/docker-$t.json" \
            cargo test -p camber-cli --test external_cli_operational -- \
            "external_docker::$t" --exact --ignored --test-threads=1 2>&1 | tee logs/external/docker.log
          [ -f "logs/external/docker-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-docker-evidence
          path: logs/external

  go:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run go lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          t=go_server_responds_if_go_available
          CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/go-$t.json" \
            cargo test -p camber-bench --test external_bench_tools -- \
            "external_go::$t" --exact --ignored --test-threads=1 2>&1 | tee logs/external/go.log
          [ -f "logs/external/go-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-go-evidence
          path: logs/external

  load-generators:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'load_generators'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build wrk 4.2.0
        run: |
          sudo apt-get install -y build-essential libssl-dev
          git clone https://github.com/wg/wrk.git "$RUNNER_TEMP/wrk"
          git -C "$RUNNER_TEMP/wrk" checkout --detach a211dd5a7050b1f9e8a9870b95513060e72ac4a0
          make -C "$RUNNER_TEMP/wrk" -j2
          echo "$RUNNER_TEMP/wrk" >> "$GITHUB_PATH"
      - run: cargo install oha --version 1.16.0 --locked
      - name: Run load_generators lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          for t in wrk_adapter_accepts_live_output oha_adapter_accepts_live_output; do
            CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/load_generators-$t.json" \
              cargo test -p camber-bench --test external_bench_tools -- \
              "external_load_generators::$t" --exact --ignored --test-threads=1 2>&1 | tee -a logs/external/load_generators.log
            [ -f "logs/external/load_generators-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-load-generator-evidence
          path: logs/external
