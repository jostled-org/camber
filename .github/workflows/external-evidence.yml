name: External Evidence

on:
  workflow_dispatch:
    inputs:
      lane:
        description: External evidence lane
        required: true
        type: choice
        options:
          - nats
          - dns
          - docker
          - go
          - load_generators
  pull_request:
    paths: &compatibility_paths
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/external-evidence.yml'
  push:
    branches: [main]
    paths: *compatibility_paths

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CAMBER_EXTERNAL_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

# Lane orchestration lives here directly — there is no repository runner.
# Every selected test runs as an exact single-test cargo invocation with a
# distinct CAMBER_EXTERNAL_CLEANUP_WITNESS path; a missing witness after a
# passing test fails the lane (cleanup evidence is part of the contract).
# Unselected lanes record a not_selected marker — never a pass.

jobs:
  not-selected:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [dns, docker, go, load_generators, nats]
    steps:
      - name: Record unselected lane
        if: matrix.lane != inputs.lane
        run: |
          mkdir -p logs/external
          printf '{"lane":"%s","status":"not_selected","run_id":"%s"}\n' \
            "${{ matrix.lane }}" "${CAMBER_EXTERNAL_RUN_ID}" \
            > "logs/external/${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.lane != inputs.lane
        with:
          name: external-${{ matrix.lane }}-not-selected
          path: logs/external/${{ matrix.lane }}.json

  nats:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'nats'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      nats:
        image: nats:2.15.0-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "pidof nats-server"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run nats lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          for t in nats_publish_and_subscribe nats_queue_group nats_async_subscribe nats_async_connect_does_not_block_worker; do
            CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/nats-$t.json" \
              cargo test -p camber --features nats --test external_feature_services -- \
              "external_nats::$t" --exact --ignored --test-threads=1 2>&1 | tee -a logs/external/nats.log
            [ -f "logs/external/nats-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-nats-evidence
          path: logs/external

  dns:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'dns'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACME_TEST_DOMAIN: ${{ secrets.ACME_TEST_DOMAIN }}
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
    steps:
      - name: Validate DNS prerequisites
        shell: bash
        run: |
          test -n "$ACME_TEST_DOMAIN" || { echo '::error::Set ACME_TEST_DOMAIN before selecting the DNS lane'; exit 1; }
          test -n "$CF_TOKEN" || { echo '::error::Set CF_TOKEN before selecting the DNS lane'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run dns lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          t=acme_dns01_provisions_cert
          CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/dns-$t.json" \
            cargo test -p camber --features dns01 --test external_feature_services -- \
            "external_dns01::$t" --exact --ignored --test-threads=1 2>&1 | tee logs/external/dns.log
          [ -f "logs/external/dns-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-dns-evidence
          path: logs/external

  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'docker'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run docker lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          t=dockerfile_builds_successfully
          CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/docker-$t.json" \
            cargo test -p camber-cli --test external_cli_operational -- \
            "external_docker::$t" --exact --ignored --test-threads=1 2>&1 | tee logs/external/docker.log
          [ -f "logs/external/docker-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-docker-evidence
          path: logs/external

  go:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run go lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          t=go_server_responds_if_go_available
          CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/go-$t.json" \
            cargo test -p camber-bench --test external_bench_tools -- \
            "external_go::$t" --exact --ignored --test-threads=1 2>&1 | tee logs/external/go.log
          [ -f "logs/external/go-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-go-evidence
          path: logs/external

  load-generators:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'load_generators'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - name: Install protoc
        run: |
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=3 update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build wrk 4.2.0
        run: |
          sudo apt-get install -y build-essential libssl-dev
          git clone https://github.com/wg/wrk.git "$RUNNER_TEMP/wrk"
          git -C "$RUNNER_TEMP/wrk" checkout --detach a211dd5a7050b1f9e8a9870b95513060e72ac4a0
          make -C "$RUNNER_TEMP/wrk" -j2
          echo "$RUNNER_TEMP/wrk" >> "$GITHUB_PATH"
      - run: cargo install oha --version 1.16.0 --locked
      - name: Run load_generators lane
        run: |
          set -euo pipefail
          mkdir -p logs/external
          for t in wrk_adapter_accepts_live_output oha_adapter_accepts_live_output; do
            CAMBER_EXTERNAL_CLEANUP_WITNESS="$PWD/logs/external/load_generators-$t.json" \
              cargo test -p camber-bench --test external_bench_tools -- \
              "external_load_generators::$t" --exact --ignored --test-threads=1 2>&1 | tee -a logs/external/load_generators.log
            [ -f "logs/external/load_generators-$t.json" ] || { echo "missing cleanup witness for $t" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-load-generator-evidence
          path: logs/external
