name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Tag and publish first so that tags exist before release-pr runs.
  # Without this ordering, release-pr generates CHANGELOG entries for
  # crates that are about to be tagged, creating a diff that triggers
  # an infinite loop of release PRs.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: release-plz@0.3.169,cargo-semver-checks@0.50.0
      - uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4 # v0.1.2
      - run: .github/scripts/release.sh release-pr --git-token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
