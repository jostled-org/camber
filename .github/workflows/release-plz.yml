name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full merge commit SHA of the release PR to recover
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Finish publication and tags before preparing the next release PR.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select merged release source
        id: source
        run: bash .github/scripts/select-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.source.outputs.source != ''
        with:
          ref: ${{ steps.source.outputs.source }}
          path: release-source
          fetch-depth: 0
      - name: Install the release source toolchain
        if: steps.source.outputs.source != ''
        working-directory: release-source
        run: rustup toolchain install
      - name: Install pinned release tools
        if: steps.source.outputs.source != ''
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: release-plz@0.3.169
      - uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4 # v0.1.2
        if: steps.source.outputs.source != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish crates, then create tags and releases
        if: steps.source.outputs.source != ''
        run: bash .github/scripts/publish-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_SOURCE: ${{ github.workspace }}/release-source
          RELEASE_CONFIG: ${{ github.workspace }}/release-plz.toml

  release-pr:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: release-plz@0.3.169,cargo-semver-checks@0.50.0
      - uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4 # v0.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: .github/scripts/release.sh release-pr --git-token "$GITHUB_TOKEN" --output json > "$RUNNER_TEMP/release-pr.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record generated release dependency inputs
        run: bash .github/scripts/refresh-release-inputs.sh "$RUNNER_TEMP/release-pr.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
