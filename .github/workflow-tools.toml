# Exact tool identities the workflow admits. `rust-toolchain.toml` pins rustc
# and cargo; these lines pin the components that toolchain ships and the tools
# CI installs through `reproduce-ci.sh install-tools`, which passes each value
# to `cargo install --locked --version`. `reproduce-ci.sh` compares each tool's
# version report against these values before any workflow phase runs.
clippy = "0.1.98"
rustfmt = "1.9.0-stable"
pedant = "0.30.1"
cargo-deny = "0.19.0"

# Local service images `check-local-integrations.sh` starts. Each reference
# names an exact version tag and the digest of its multi-platform index. The
# runner starts the image by digest and refuses an engine that reports another
# identity. Cargo never installs these.
image.nats = "docker.io/library/nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4"
image.elasticmq = "docker.io/softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c"
image.pebble = "ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199"
image.challtestsrv = "ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b"
