# Semantic architecture rules for the streaming body consumer.
#
# The repository defaults, plus mixed-concern enforcement: this module forwards
# the wire under a bound it was handed and never derives one. The bound itself
# lives in `body_admission.rs`, so byte arithmetic appearing here — an unbounded
# `BodyStream`, a second adapter, a hand-rolled running total — is the mixed
# concern this config exists to catch. Those exact spellings are matched
# textually by the `body-admission-architecture` proof command, which is where a
# pattern ban can be stated; Pedant's config surface carries the structural
# checks below and no pattern list.
#
# The repository's explicit dynamic-dispatch exceptions are retained: this
# module builds and forwards the heterogeneous outbound bodies and boxed futures
# the proxy API is built from.
check_mixed_concerns = true
check_dyn_field = false
check_dyn_param = false
check_clone_in_loop = false
check_vec_box_dyn = false
max_depth = 2
check_long_function_body = true
max_function_body_lines = 80
